[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img2svg"
version = "0.1.0"
description = "JEV-routed raster to SVG conversion with VTracer and SVG verification."
requires-python = ">=3.11"
dependencies = [
  "vtracer>=1.0.0a4",
  "Pillow>=10",
]

[project.optional-dependencies]
verify = ["cairosvg>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
img2svg = "img2svg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
